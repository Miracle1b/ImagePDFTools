name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o ImagePDFTools_PHONE_READY_FIXED.zip -d project
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/project" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Fix AndroidManifest
        run: |
          FILE="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          if [ -f "$FILE" ]; then
            sed -i

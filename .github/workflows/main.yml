name: Build Android AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o ImagePDFTools_UI_V6.zip -d project
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/project" >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Fix AndroidManifest
        run: |
          FILE="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ -f "$FILE" ]; then
            sed -i 's/Image & PDF Tools/Image \&amp; PDF Tools/g' "$FILE"
          fi

      - name: Fix minSdk
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ -f "$FILE" ]; then
            sed -i -E 's/minSdk *= *23/minSdk = 24/g' "$FILE"
            sed -i -E 's/minSdkVersion *= *23/minSdkVersion = 24/g' "$FILE"
          fi

      - name: Set target SDK 36
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"

          sed -i -E 's/targetSdk *= *[0-9]+/targetSdk = 36/g' "$FILE"
          sed -i -E 's/targetSdkVersion *= *[0-9]+/targetSdkVersion = 36/g' "$FILE"

          cat >> "$FILE" <<'EOF'

          // IMAGEPDFTOOLS_TARGET_API_36
          android {
              defaultConfig {
                  targetSdk = 36
              }
          }
          EOF

      - name: Fix Java JVM target
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"

          cat >> "$FILE" <<'EOF'

          // IMAGEPDFTOOLS_JAVA17
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/imagepdftools-upload.jks"

      - name: Configure Release Signing
        run: |
          FILE="$PROJECT_DIR/app/build.gradle.kts"

          cat >> "$FILE" <<'EOF'

          // IMAGEPDFTOOLS_RELEASE_SIGNING
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("../imagepdftools-upload.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF

      - name: Build Release AAB
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle clean bundleRelease --stacktrace

      - name: Verify AAB signature
        run: |
          jarsigner -verify -verbose -certs \
            "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ImagePDFTools-release-aab
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
